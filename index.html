<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fortnite Daily Shop</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #061329;
        --bg-deep: #020817;
        --line: rgba(151, 197, 255, 0.25);
        --text: #f3f8ff;
        --muted: #a9c4e8;
        --yellow: #ffd438;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 0%, rgba(40, 216, 255, 0.16), transparent 34rem),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      header,
      main {
        width: min(1120px, calc(100% - 24px));
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 0 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 4vw, 2.7rem);
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .updated {
        color: var(--muted);
        font-size: 0.9rem;
        text-align: right;
      }

      .image-frame {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(3, 12, 31, 0.66);
        box-shadow: 0 20px 46px rgba(0, 0, 0, 0.35);
      }

      .shop-image {
        display: block;
        width: 100%;
        height: auto;
      }

      .actions {
        display: flex;
        justify-content: center;
        padding: 18px 0 34px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid rgba(255, 212, 56, 0.55);
        border-radius: 8px;
        background: rgba(255, 212, 56, 0.12);
        color: var(--yellow);
        font-weight: 800;
        text-decoration: none;
      }

      .status {
        display: grid;
        place-items: center;
        min-height: 52vh;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 640px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .updated {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Fortnite Daily Shop</h1>
      <div class="updated" id="updated">Loading shop image</div>
    </header>

    <main>
      <div class="image-frame">
        <img class="shop-image" id="shop-image" src="shop.png" alt="Fortnite Daily Shop" />
      </div>
      <div class="actions">
        <a class="button" id="image-link" href="shop.png">Open Image</a>
      </div>
    </main>

    <script>
      const updated = document.querySelector("#updated");
      const image = document.querySelector("#shop-image");
      const imageLink = document.querySelector("#image-link");

      const formatTime = (value) => {
        if (!value) return "Waiting for first update";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "Shop image ready";

        return new Intl.DateTimeFormat("zh-CN", {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(date);
      };

      fetch("shop.json", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((data) => {
          const version = encodeURIComponent(data.hash || data.updatedAt || Date.now());
          const imageUrl = `shop.png?v=${version}`;
          image.src = imageUrl;
          imageLink.href = imageUrl;
          updated.textContent = `Updated ${formatTime(data.updatedAt || data.date)}`;
        })
        .catch(() => {
          updated.textContent = "Shop image";
        });

      image.addEventListener("error", () => {
        document.querySelector("main").innerHTML = '<div class="status">shop.png is not ready yet</div>';
      });
    </script>
  </body>
</html>
